name: Scrape Gudoball

on:
  schedule:
    # 14:10, 16:10, 18:10, 20:10, 22:10 Asia/Bangkok (UTC+7)
    # => 07:10, 09:10, 11:10, 13:10, 15:10 UTC
    # Source (gudoball.club) posts the day's tips in the afternoon (~16:00)
    # and updates again in the evening (~20:30-23:00); the old 11:45 morning
    # run never produced changes. :10 offset dodges top-of-hour queue delay.
    - cron: "10 7,9,11,13,15 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/run_scrape.py

      - name: Commit and push data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: update gudoball latest data"
          git push
